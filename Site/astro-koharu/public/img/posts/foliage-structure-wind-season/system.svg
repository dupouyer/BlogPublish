<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">植被材质的共享结构数据</title><desc id="desc">全局环境与结构数据共同驱动风动和外观，分别输出位移及材质属性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#69d6ab"/></marker></defs><rect width="600" height="750" rx="24" fill="#101e2c"/><g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="300" y="51" fill="#dce7ed" font-size="24">结构数据成为共同语言</text><rect x="40" y="83" width="520" height="104" rx="14" fill="#213a4a"/><text x="300" y="123" fill="#dce7ed" font-size="23">全局环境</text><text x="300" y="159" fill="#adbfcb" font-size="19">风向 · 阵风 · Season · Health</text><rect x="40" y="215" width="520" height="122" rx="14" fill="#23473e" stroke="#69d6ab"/><text x="300" y="255" fill="#dce7ed" font-size="23">资产 / 实例结构</text><text x="300" y="290" fill="#b4ddca" font-size="19">权重 · 种子 · LeafMask</text><text x="300" y="317" fill="#b4ddca" font-size="18">可选 Pivot / Exposure</text><path d="M180 337V379M420 337V379" stroke="#69d6ab" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="391" width="240" height="126" rx="14" fill="#213a4a"/><rect x="320" y="391" width="240" height="126" rx="14" fill="#213a4a"/><text x="160" y="433" fill="#dce7ed" font-size="23">运动计算</text><text x="160" y="468" fill="#adbfcb" font-size="18">风场 × 结构权重</text><text x="160" y="495" fill="#adbfcb" font-size="18">Primary + Secondary</text><text x="440" y="433" fill="#dce7ed" font-size="23">外观计算</text><text x="440" y="468" fill="#adbfcb" font-size="18">状态阈值 → Mask</text><text x="440" y="495" fill="#adbfcb" font-size="18">LUT / 属性曲线</text><path d="M160 517V568M440 517V568" stroke="#69d6ab" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="579" width="240" height="89" rx="14" fill="#23473e"/><rect x="320" y="579" width="240" height="89" rx="14" fill="#4b3c2d"/><text x="160" y="617" fill="#dce7ed" font-size="22">WPO</text><text x="160" y="649" fill="#adbfcb" font-size="18">另需处理法线与 Bounds</text><text x="440" y="617" fill="#e5d6aa" font-size="21">材质属性</text><text x="440" y="649" fill="#d4c29e" font-size="18">颜色 · 粗糙度 · 透光</text><text x="300" y="718" fill="#8098ac" font-size="17">原创示意 · 非 Epic 材质源码布局</text></g></svg>
