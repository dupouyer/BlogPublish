<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Unreal Engine tool output information lifecycle</title><desc id="d">UE Editor and MCP output is filtered into working memory and persistent evidence. Task compaction replaces old history but can retrieve archived evidence.</desc>
