<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Mirrored quad UV and tangent basis</title><desc id="d">At the same normalized screen position x, the original samples U=x and the mirrored quad U=1-x. T reverses; B and N stay unchanged.</desc><rect width="1000" height="420" rx="20" fill="#101722"/><g font-family="system-ui,sans-serif" font-size="24" fill="#e9edf5"><text x="70" y="50">ScaleX = +1</text><text x="570" y="50">ScaleX = -1</text><text x="70" y="325">U = x</text><text x="570" y="325">U = 1 - x</text><text x="70" y="370">T, B, N</text><text x="570" y="370">-T, B, N</text></g><g stroke="#64748b" stroke-width="2" fill="#192433"><rect x="70" y="80" width="350" height="210"/><rect x="570" y="80" width="350" height="210"/></g><g stroke="#f78798" stroke-width="5" fill="#f78798"><path d="M110 190H360M880 190H630"/><path d="M360 190l-15 -10v20zM630 190l15 -10v20z"/></g><g font-family="system-ui,sans-serif" font-size="24" fill="#f78798"><text x="220" y="170">T</text><text x="720" y="170">T'</text></g><g fill="#71dace"><circle cx="179" cy="230" r="7"/><circle cx="679" cy="230" r="7"/></g><g font-family="system-ui,sans-serif" font-size="20" fill="#71dace"><text x="110" y="264">x = 0.31, U = 0.31</text><text x="610" y="264">x = 0.31, U = 0.69</text></g></svg>
