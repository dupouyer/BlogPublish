<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双 ID 的离线 Fixing</title><link rel="stylesheet" href="../gdc-terrain-architecture/lab.css"></head><body><div class="eyebrow">GDC TERRAIN / 02 · ID FIXING</div><h1>六个候选怎样限制成三种材质</h1><p>先保留所有 Bottom，再按 Top Weight 填满集合，超额 Top 退回 Bottom。改变例子可观察三个不同 Bottom 已占满集合的情况。</p><nav></nav><div class="toolbar"><button id="play" aria-pressed="false">播放</button><button id="step">下一步</button><button id="reset">重置</button><label>例子 <select id="example"><option value="0">两个 Bottom，剩一个位置</option><option value="1">三个 Bottom，集合已满</option></select></label><label>采样点 X <input id="sample" type="range" min="0" max="100" value="45"></label></div><div class="layout"><figure class="plot"><canvas id="view" width="700" height="520" aria-label="三角形双 ID、保留集合与材质权重"></canvas><figcaption>黄色点为运行时采样位置；三个重心坐标之和为 1。</figcaption></figure><aside class="panel"><h2 id="stage"></h2><p id="why"></p><div id="stats" class="readout"></div><p class="note">说明性小例子，数据与颜色是本文构造。邻三角形安全性依赖“只移除 Top、Bottom 不变”的约束，完整地图仍需逐三角形检查。</p></aside></div><noscript>先保留 Bottom 集合；按权重加入 Top；集合最多 3 种；超额 Top 改成 Bottom。运行时分别计算每种材质在三点的权重，再以重心坐标插值。</noscript><script type="module">
import {$,mix,text,line,box,dot,clear,palette,setup} from '../gdc-terrain-architecture/lab-runtime.js';
const c=$('#view').getContext('2d');let step=0,tab='fix',sample=.45;
function state(){const input=Number($('#example').value)?[{b:1,t:4,w:.8},{b:2,t:5,w:.6},{b:3,t:6,w:.2}]:[{b:1,t:4,w:.8},{b:1,t:5,w:.6},{b:2,t:6,w:.2}],points=input.map(p=>({...p})),set=new Set();if(step>=1)points.forEach(p=>set.add(p.b));if(step>=2)for(const p of [...points].sort((a,b)=>b.w-a.w)){if(set.has(p.t))continue;if(set.size<3)set.add(p.t);else if(step>=3)p.t=p.b}return{input,points,ids:[...set]}}
function draw(){clear(c);const {input,points,ids}=state(),ps=[[100,415],[590,415],[345,75]],lambda=[(1-sample)*.7,sample*.7,.3],px=ps.reduce((v,p,i)=>v+p[0]*lambda[i],0),py=ps.reduce((v,p,i)=>v+p[1]*lambda[i],0);line(c,[...ps,ps[0]],'#62d9c4',2);for(let i=0;i<3;i++){dot(c,...ps[i],7,'#62d9c4');const p=points[i],x=i===0?25:i===1?460:230,y=i===2?25:450; text(c,`P${i}: B${p.b} / T${p.t} / w${p.w}`,x,y,'#e3ecf4',15);if(input[i].t!==p.t)text(c,`T${input[i].t} → B${p.b}`,x,y+25,'#f5be6e',14)}dot(c,px,py,8,'#f5be6e');text(c,`λ=[${lambda.map(v=>v.toFixed(2)).join(',')}]`,180,510,'#f5be6e',14);text(c,'保留 ID 集合',165,185,'#9fb0c3',15);for(let i=0;i<3;i++){box(c,165+i*115,205,100,52,ids[i]===undefined?'#1b2c3d':'#255e56');text(c,ids[i]===undefined?'空':`ID ${ids[i]}`,180+i*115,239,'#62d9c4',18)}
const titles=['原始六候选','保留 Bottom','按 Top 权重加入','超额 Top 退回 Bottom','运行时恢复权重'],why=['三个点各有两个候选，最多六种独立 ID。','三个 Bottom 最多三种，全部优先保留。','Top .8 → .6 → .2；已有编号不重复占容量。','移除超额 Top 后，ID 并集大小不再超过 3。','先按每点 Bottom/Top 得到材质权重，再重心插值。'];$('#stage').textContent=`${step+1}/5 ${titles[step]}`;$('#why').textContent=why[step];const all=[...new Set(points.flatMap(p=>[p.b,p.t]))];const ws=all.map(id=>({id,w:points.reduce((s,p,i)=>s+lambda[i]*((p.b===id?1-p.w:0)+(p.t===id?p.w:0)),0)}));$('#stats').textContent=`独立候选 ${all.length} · 集合 [${ids.join(',')}]\n`+(step===4?ws.map(x=>`ID${x.id}=${x.w.toFixed(3)}`).join(' · '):'继续单步观察集合与顶点字段');}
setup({tabs:[['fix','离线修正 → 运行时插值']],onTab:id=>{tab=id},onStep:()=>{step=(step+1)%5},onReset:()=>{step=0},draw,interval:1100});$('#example').onchange=()=>{step=0;draw()};$('#sample').oninput=e=>{sample=Number(e.target.value)/100;draw()};window.terrainLab={snapshot:()=>({step,...state()}),step:()=>{step=(step+1)%5;draw()}};
</script></body></html>
