<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Agent Context: Working Memory, Not a Log Archive</title>
<desc id="desc">Technical editorial illustration showing verbose logs flowing through a context filter into a compact active working set.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#1e3441"/></linearGradient><linearGradient id="hot" x1="0" x2="1"><stop stop-color="#f9b773"/><stop offset="1" stop-color="#e57b60"/></linearGradient><linearGradient id="cool" x1="0" x2="1"><stop stop-color="#58b5b1"/><stop offset="1" stop-color="#94ddc4"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6d95a2" stroke-opacity=".09"/></pattern></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="112" y="158" fill="#9bc7c8" font-family="sans-serif" font-size="31" letter-spacing="7">AGENT CONTEXT ENGINEERING</text>
<text x="105" y="265" fill="#f3ede2" font-family="sans-serif" font-size="76" font-weight="700">Context ≠ Log Archive</text>
<text x="110" y="326" fill="#abbec3" font-family="sans-serif" font-size="28">Compaction · Cache · Information Lifecycle</text>
<rect x="110" y="410" width="435" height="334" rx="22" fill="#122632" stroke="#b16f5a" stroke-opacity=".8" stroke-width="2"/>
<text x="142" y="454" font-family="monospace" font-size="25" fill="#ffbc8c">RAW TOOL OUTPUT</text>
<g font-family="monospace" font-size="21" fill="#ce9c86"><text x="145" y="511">[Log] shader_compile ...</text><text x="145" y="549">[Warn] retries: 00051</text><text x="145" y="587">[Log] node dump ...</text><text x="145" y="625">[Log] shader_compile ...</text><text x="145" y="663">[Warn] retries: 00052</text><text x="145" y="700">[Log] ... ... ...</text></g>
<path d="M563 572 H747" stroke="url(#hot)" stroke-width="11" stroke-linecap="round"/><path d="M728 552 L758 572 728 592" fill="none" stroke="#f5aa7a" stroke-width="11" stroke-linejoin="round"/><text x="594" y="541" font-family="sans-serif" font-size="19" fill="#c2d9dc">FILTER / DIFF</text>
<rect x="778" y="410" width="332" height="334" rx="22" fill="#13383b" stroke="#67b6b1" stroke-width="2"/>
<text x="810" y="454" font-family="monospace" font-size="25" fill="#93e4cb">ACTIVE STATE</text>
<g font-family="monospace" font-size="20" fill="#c5e9db"><text x="811" y="526">root_cause: ✓</text><text x="811" y="571">current_error: 1</text><text x="811" y="616">next_test: A/B</text><text x="811" y="661">evidence: ref/012</text></g>
<path d="M1127 572 H1258" stroke="url(#cool)" stroke-width="11" stroke-linecap="round"/><path d="M1240 552 L1270 572 1240 592" fill="none" stroke="#85d9c7" stroke-width="11" stroke-linejoin="round"/>
<rect x="1290" y="449" width="198" height="244" rx="28" fill="#1c4b4d" stroke="#87d8c4" stroke-width="2"/>
<circle cx="1389" cy="533" r="54" fill="#2f7978"/><path d="M1356 532 l24 23 44 -50" fill="none" stroke="#daf4df" stroke-width="10" stroke-linecap="round"/><text x="1389" y="637" text-anchor="middle" fill="#d0f3e2" font-size="23" font-family="sans-serif">NEXT ACTION</text>
<text x="114" y="820" fill="#a9bfc5" font-family="sans-serif" font-size="23">Less repeated history. More evidence for the next decision.</text>
</svg>