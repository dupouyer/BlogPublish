<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地形流送：页面、Clipmap 与材质缓存</title><link rel="stylesheet" href="../gdc-terrain-architecture/lab.css"></head><body>
<div class="eyebrow">GDC TERRAIN / 03 · STREAMING</div><h1>让一次页面请求走完整条路径</h1><p class="intro">每次“下一步”推进一个真实模型状态。黄色是待处理，绿色是已驻留；缺少细页时查询父级，物理槽位数量始终有限。</p><nav aria-label="实验主题"></nav>
<div class="toolbar"><button id="play" aria-pressed="false">播放</button><button id="step">下一步</button><button id="reset">重置</button><label>相机 X <input id="camera" type="range" min="0" max="100" value="25"><output id="cameraValue">25</output></label><button id="jump">快速跨区</button></div>
<div class="controls" id="pageControls"><label>页面来源 <select id="producer"><option value="hybrid" selected>混合 · 细页 RVT / 粗页 SVT</option><option value="rvt">RVT · GPU 合成</option><option value="svt">SVT · 磁盘读取</option></select></label><label>每批页面预算 <input id="budget" type="range" min="1" max="4" value="2"><output id="budgetValue">2</output></label><button id="edit">修改道路：使缓存失效</button></div>
<div class="steps" id="stages"></div><div class="layout"><figure class="plot"><canvas id="view" width="760" height="640" aria-label="各 Mip 请求、Clipmap 窗口或活动材质槽位"></canvas><figcaption id="caption"></figcaption></figure><aside class="panel"><h2 id="topic"></h2><p id="explain"></p><div class="readout" id="stats"></div><h2>本次状态变化</h2><div class="log" id="log" aria-live="polite"></div><p id="formula" class="note"></p></aside></div>
<p class="note">教学模拟：16×16 逻辑细页、20 个物理槽、8×8 Clipmap。它执行请求去重、LRU 淘汰、父 Mip 回退、环形寻址和分批发布；不模拟磁盘耗时、GPU 压缩或原游戏调度器。观察时延以步数计。</p><noscript><p>静态路径：屏幕像素提出 (Mip,X,Y) 请求 → 缺页去重 → SVT 读盘或 RVT 合成 → 填入物理槽 → 发布页表。细页缺失时采样常驻父页；Clipmap 移动只更新新进入的行列。</p></noscript>
<script type="module" src="streaming.js"></script></body></html>
