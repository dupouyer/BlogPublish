<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
<title id="t">法线混合的三条计算路径</title><desc id="d">Lerp 每次平均并归一化；RNM 将细节参考上方转向当前 Base；SG 在共同基底相加坡度，最后恢复法线。</desc><rect width="960" height="360" rx="16" fill="#142033"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#e6eef9"><g font-size="24" font-weight="700"><text x="160" y="48">Sequential Lerp</text><text x="480" y="48">RNM</text><text x="800" y="48">Surface Gradient</text></g><g font-size="18"><text x="160" y="105">A + B → normalize</text><text x="160" y="155">↓ 与 C 平均</text><text x="160" y="205">↓ 与 D 平均</text><text x="480" y="105">Base A ← Detail B</text><text x="480" y="155">↓ 重定向 C</text><text x="480" y="205">↓ 重定向 D</text><text x="800" y="105">pA + pB + pC + pD</text><text x="800" y="155">↓ 共同切线基</text><text x="800" y="205">normalize(p.x, p.y, 1)</text></g><g font-size="17" fill="#77e2d3"><text x="160" y="278">后层会稀释已有方向</text><text x="480" y="278">主从结构，通常顺序相关</text><text x="800" y="278">固定权重下顺序无关</text></g><text x="480" y="329" font-size="16" fill="#b1c3dc">输入：已解码单位法线，正 z；SG 此处限定为同一正交切线基下的坡度叠加</text></g><path d="M320 75V285M640 75V285" stroke="#526780"/>
</svg>
