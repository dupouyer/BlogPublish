<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界生产：高度层、Mask 与实例整合</title><link rel="stylesheet" href="../gdc-terrain-architecture/lab.css"></head><body>
<div class="eyebrow">GDC TERRAIN / 05 · AUTHORING</div><h1>从高度和规则，看到真正生成的数据</h1><p class="intro">同一块地形生成高度层、坡度、曲率、汇流、湿度、道路排除和实例点。改变道路宽度后，逐步检查哪些产物已经更新、哪些仍然陈旧。</p><nav aria-label="生产流程实验"></nav><div class="toolbar"><button id="play" aria-pressed="false">播放</button><button id="step">下一步</button><button id="reset">重置</button><label>阶段 <input id="progress" type="range" min="0" max="100" value="0"><output id="progressValue">0</output></label></div>
<div class="controls"><label>道路宽度 <input id="roadWidth" type="range" min="3" max="14" value="6"><output id="widthValue">6</output></label><label id="maskControl">查看数据 <select id="mask"><option value="height">Height · 高度</option><option value="slope">Slope · 坡度</option><option value="curvature">Curvature · 曲率</option><option value="roughness">Roughness · 地形粗糙度</option><option value="flow">Flow Accum · 汇流量</option><option value="wetness">Wetness · 湿度</option><option value="sun">Sun · 日照代理</option><option value="road">Road Mask · 道路</option><option value="density">Density · 候选密度</option></select></label><button id="change">修改道路并标脏</button></div>
<div class="layout"><figure class="plot"><canvas id="view" width="760" height="650" aria-label="高度层、实际 Mask 数据、实例剔除及缓存依赖"></canvas><figcaption id="caption"></figcaption></figure><aside class="panel"><h2 id="topic"></h2><p id="explain"></p><div class="readout" id="stats"></div><p id="observe"></p><div class="log" id="log" aria-live="polite"></div><p class="note" id="formula"></p></aside></div>
<p class="note">教学数据为 96×96 程序化 Heightfield。坡度/曲率由有限差分计算；汇流为按高度排序的 D8 无洼地填充简化模型；日照仅是固定太阳方向的法线代理，未做遮挡与全年积分。所有数据是本文生成，不是 Wildlands 导出的资产。</p><noscript><p>Base → Macro → DCC Terraform → Micro 编辑层；从高度计算坡度与曲率，结合水体生成湿度，再形成分布密度。候选点贴地后按道路、河流和岩石排除。高度、实例、碰撞和远景缓存分别记录构建版本。</p></noscript><script type="module" src="authoring.js"></script></body></html>
