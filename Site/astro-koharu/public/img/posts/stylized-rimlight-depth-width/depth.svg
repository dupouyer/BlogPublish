<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Directional depth comparison</title><desc id="d">Shift from a foreground pixel toward the light in screen space. The shifted pixel lies on a farther background. Positive linear depth difference marks the inner rim.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ffbb73"/></marker></defs><rect width="900" height="400" rx="18" fill="#111e32"/><g font-family="system-ui,sans-serif" font-size="18" fill="#e0eaf4"><text x="40" y="42" font-size="23">Find the far side of a visible boundary</text><path d="M70 295H410V125H70Z" fill="#355369"/><path d="M410 295H830V125H410Z" fill="#182d47"/><path d="M410 100V315" stroke="#95a6b5" stroke-dasharray="6 5"/><circle cx="340" cy="210" r="9" fill="#ffbb73"/><circle cx="475" cy="210" r="9" fill="#50c8e8"/><path d="M354 210H460" stroke="#ffbb73" stroke-width="3" marker-end="url(#a)"/><text x="220" y="180">p: foreground</text><text x="493" y="215">p + offset: background</text><text x="363" y="251" font-size="15">toward light</text><text x="225" y="280" fill="#ffbb73">Z = 8 m</text><text x="573" y="280" fill="#50c8e8">Z = 30 m</text><text x="80" y="350">Positive depth jump: 30 - 8 = 22 m</text><text x="520" y="350" font-size="15">Mask belongs to foreground pixel p.</text><text x="80" y="85" font-size="15" fill="#a7bdce">Screen-space sample positions · linear view depth at each position</text></g></svg>