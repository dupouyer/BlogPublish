<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地形几何：实例、CDLOD、拼接、细分与位移</title><link rel="stylesheet" href="../gdc-terrain-architecture/lab.css"></head><body>
<div class="eyebrow">GDC TERRAIN / 04 · GEOMETRY</div><h1>看见网格怎样被选择、拼接和推动</h1><p class="intro">先看俯视拓扑，再看接缝剖面，最后看同一高度函数生成的三维三角形。每个实验有独立的操作目标。</p><nav aria-label="几何实验"></nav><div class="toolbar"><button id="play" aria-pressed="false">播放</button><button id="step">下一步</button><button id="reset">重置</button><label>进度 <input id="progress" type="range" min="0" max="100" value="0"><output id="progressValue">0%</output></label></div>
<div class="controls"><label id="factorControl">局部细分 <select id="factor"><option value="2">2×2 子区</option><option value="4" selected>4×4 子区</option><option value="8">8×8 子区</option></select></label><label id="densityControl">位移网格 <select id="density"><option value="8">8×8 cells</option><option value="32" selected>32×32 cells</option><option value="64">64×64 cells</option></select></label><label id="ampControl">位移幅度 <input id="amplitude" type="range" min="0" max="100" value="65"></label><label id="normalControl"><input id="normalOnly" type="checkbox">只改着色法线</label><label id="wireControl"><input id="wire" type="checkbox" checked>线框</label><label id="angleControl">视角 <input id="angle" type="range" min="0" max="100" value="30"></label></div>
<div class="layout"><figure class="plot"><canvas id="view" width="760" height="610" aria-label="网格拓扑与高度剖面动画"></canvas><figcaption id="caption"></figcaption></figure><aside class="panel"><h2 id="topic"></h2><p id="explain"></p><div class="readout" id="stats"></div><p id="observe"></p><p class="note" id="formula"></p></aside></div><p class="note">教学模型：规则模板实例和三角形均由代码生成；三维画面使用 Canvas 投影和面法线照明。Morph 用一条边演示 2:1 退化；4×4 演示局部选区及模板缩放，不宣称复现三角洲未公开的所有过渡边算法，也不测量 GPU 性能。</p><noscript><p>固定模板通过 Origin+UV×Size 放到世界；细边奇数点向粗边偶数点移动，重新采样高度后与粗边共线。局部细分增加空间采样，材质 Displacement 另行改变每个顶点高度；只改法线不改变轮廓。</p></noscript><script type="module" src="geometry.js"></script></body></html>
